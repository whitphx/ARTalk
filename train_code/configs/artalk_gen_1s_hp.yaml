# Stage 2 of the 1 s chunk experiment on the head-pose data build. Two
# data augmentations over the base recipe: STATIC_PREV_AUG replaces the
# previous-context window with one held pose (the state a deployed idle
# loop reaches after long silence), and SILENT_AUDIO_AUG zeroes the audio
# of real pause windows while holding the target window's mouth at its
# median, because the corpus has no pause whose mouth is actually still.
# Data and VAE_PATH point at the rebuilt LMDB and its stage-1 codec, whose
# gpose dimensions carry head rotation recovered from the tracker's
# transform matrices; the delivered build had them at exactly zero, which
# both froze the head and, at a std of 1e-6, left them unnormalizable.
PIPELINE: 'ar_trainer.ARTrainer'
WANDB_ENTITY: null
WANDB_PROJECT: 'ARTalk-1s-hp'
DUMP_DIR: './outputs'


DATASET:
  NAME: 'ARTalkData'
  LOADER: 'artalk_data.ARTalkData'
  CLIP_LENGTH: 25
  PREV_LENGTH: 75
  STYLE_LENGTH: 100
  MOTION_FPS: 25
  AUDIO_SAMPLE_RATE: 16000
  STATIC_PREV_AUG: 0.15
  SILENT_AUDIO_AUG: 0.5
  SILENT_AUDIO_RMS: 0.005
  DATA_PATH: '/path/to/artalk-1s-hp-data/data_lmdb'
  META_PATH: '/path/to/artalk-1s-hp-data/metadata.json'


MODEL:
  NAME: 'ARTalkGen'
  LOADER: 'artalk_gen.ARTalkGen'
  AUDIO_ENCODER: 'wav2vec'
  T_DEPTH: 8
  T_NUM_HEAD: 8
  T_EMBED_DIM: 512

  FLIP_QUANT: 0.3
  PREV_FREE: 0.1
  AUDIO_FREE: 0.1
  STYLE_FREE: 0.1

  PRETRAIN_PATH: null

  VAE_CONFIG:
    LOADER: 'artalk_codec.ARTalkCodec'
    MOTION_DIM: 106
    V_CODE_DIM: 32
    V_PATCH_NUMS: [1, 5, 25]
    T_DEPTH: 8
    T_NUM_HEADS: 8
    T_HIDDEN_DIM: 512
    STATS_PATH: '/path/to/artalk-1s-hp-data/metadata_stats.json'
    VAE_PATH: '/path/to/outputs/ARTalkCodec_ARTalk/<run>/checkpoints/iter_200000.pt'


TRAINER:
  # TRAIN LOOP
  BATCH_SIZE: 128
  TRAIN_ITER: 200000
  CHECK_INTERVAL: 20000

  # OPTIMIZER
  NAME: 'Adam'
  WARMUP_ITER: 1000
  LR_DECAY_RATE: 0.1
  LR_DECAY_ITER: 200000
  LEARNING_RATE: 1.0e-4

  # EMA
  USING_EMA: True
  EMA_DECAY: 0.9999
  EMA_UPDATE_FREQ: 1


LOSS_KWARGS:
  CE_WEIGHT: 1.0
