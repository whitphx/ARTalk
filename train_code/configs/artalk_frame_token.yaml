PIPELINE: 'ar_trainer.ARTrainer'
WANDB_ENTITY: null
WANDB_PROJECT: 'ARTalk-frame'
DUMP_DIR: './outputs'

DATASET:
  NAME: 'ARTalkData'
  LOADER: 'artalk_data.ARTalkData'
  CLIP_LENGTH: 100
  PREV_LENGTH: 100
  STYLE_LENGTH: 100
  MOTION_FPS: 25
  AUDIO_SAMPLE_RATE: 16000
  DATA_PATH: '/path/to/artalk-108-data/data_lmdb'
  META_PATH: '/path/to/artalk-108-data/metadata.json'

MODEL:
  NAME: 'ARTalkFrameToken'
  LOADER: 'artalk_frame_gen.ARTalkFrameToken'
  MOTION_DIM: 108
  EXPRESSION_DIM: 100
  SAMPLE_RATE: 16000
  MOTION_FPS: 25
  AUDIO_DIM: 192
  STYLE_DIM: 128
  MOTION_EMBED_DIM: 128
  HIDDEN_DIM: 384
  NUM_LAYERS: 2
  DROPOUT: 0.1
  STYLE_DROPOUT: 0.1
  AUDIO_FREE: 0.1
  STATS_PATH: '/path/to/artalk-108-data/metadata_stats.json'
  VAE_CONFIG:
    NAME: 'ARTalkCodec'
    LOADER: 'artalk_codec.ARTalkCodec'
    MOTION_DIM: 108
    V_CODE_DIM: 32
    V_PATCH_NUMS: [1]
    FRAME_INDEPENDENT: True
    T_DEPTH: 8
    T_NUM_HEADS: 8
    T_HIDDEN_DIM: 512
    STATS_PATH: '/path/to/artalk-108-data/metadata_stats.json'
    VAE_PATH: '/path/to/codec_frame/iter_XXXX.pt'

TRAINER:
  BATCH_SIZE: 32
  TRAIN_ITER: 200000
  CHECK_INTERVAL: 10000
  WARMUP_ITER: 2000
  LR_DECAY_RATE: 0.1
  LR_DECAY_ITER: 200000
  LEARNING_RATE: 2.0e-4
  WEIGHT_DECAY: 1.0e-2
  USING_EMA: True
  EMA_DECAY: 0.9999
  EMA_UPDATE_FREQ: 1

LOSS_KWARGS:
  CE_WEIGHT: 1.0
